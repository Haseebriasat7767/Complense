name: Refresh production dependency lockfile

on:
  push:
    branches:
      - fix/evidence-created-by-user
    paths:
      - .github/workflows/refresh-production-dependencies.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve patched versions into the lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install the refreshed lockfile
        run: npm ci
      - name: Require a clean production dependency audit
        run: npm audit --omit=dev --audit-level=low
      - name: Run tests
        run: npm test
      - name: Build production bundles
        run: npm run build
      - name: Publish isolated dependency-update branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/security-dependencies-${GITHUB_SHA::7}"
          git switch -c "$branch"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already clean; no dependency-update branch is needed."
            exit 0
          fi
          git commit -m "fix: refresh patched production dependencies"
          git push origin "HEAD:refs/heads/$branch"
          echo "Created $branch for review; no production branch was changed."
