name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply compatible dependency security updates
        run: npm audit fix
      - name: Commit dependency lockfile updates
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: patch vulnerable npm dependencies"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Verify production dependencies
        run: npm audit --omit=dev
      - name: Run tests
        run: npm test
      - name: Build production bundles
        run: npm run build
