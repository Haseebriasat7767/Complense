name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply compatible security patches to the dependency lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Upload regenerated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Audit production dependencies (release gate)
        run: npm audit --omit=dev --audit-level=low
      - name: Run tests
        run: npm test
      - name: Build production bundles
        run: npm run build

      - name: Commit refreshed lockfile to the reviewed PR branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "The committed lockfile is already up to date."
            exit 0
          fi
          git commit -m "fix: refresh patched production dependency lockfile"
          git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
