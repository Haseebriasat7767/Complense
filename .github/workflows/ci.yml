name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile from reviewed package manifests
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Upload regenerated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Audit production dependencies (release gate)
        run: npm audit --omit=dev --audit-level=low
      - name: Run tests
        run: npm test
      - name: Build production bundles
        run: npm run build
